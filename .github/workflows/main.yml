name: Build and Publish ProComic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Extension
        run: |
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git upstream
          mkdir -p upstream/src/ar/procomic
          cp -a procomic/. upstream/src/ar/procomic/
          cd upstream
          chmod +x gradlew
          ./gradlew :src:ar:procomic:spotlessApply
          ./gradlew :src:ar:procomic:assembleRelease

      - name: Prepare Mihon Repo Index
        run: |
          rm -rf repo
          mkdir -p repo/apk repo/jar
          cp upstream/src/ar/procomic/build/outputs/apk/release/*.apk repo/apk/procomic.apk
          cp upstream/src/ar/procomic/build/outputs/jar/release/*.jar repo/jar/procomic.jar
          cat > repo/index.json <<'EOF'
          {
            "name": "ProComic Custom Repo",
            "badgeLabel": "PRO",
            "signingKey": "",
            "contact": {
              "website": "https://github.com/${{ github.repository }}"
            },
            "extensionList": {
              "extensions": [
                {
                  "name": "ProComic",
                  "packageName": "eu.kanade.tachiyomi.extension.ar.procomic",
                  "resources": {
                    "apkUrl": "https://raw.githubusercontent.com/${{ github.repository }}/repo/apk/procomic.apk",
                    "iconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/procomic/res/mipmap-xxxhdpi/ic_launcher.png",
                    "jarUrl": "https://raw.githubusercontent.com/${{ github.repository }}/repo/jar/procomic.jar"
                  },
                  "extensionLib": "1.6",
                  "versionCode": "4",
                  "versionName": "1.6.4",
                  "contentWarning": "CONTENT_WARNING_SAFE",
                  "sources": [
                    {
                      "id": "5402507379714769896",
                      "name": "بروكوميك",
                      "language": "ar",
                      "homeUrl": "https://procomic.net"
                    }
                  ]
                }
              ]
            }
          }
          EOF
          python3 -m json.tool repo/index.json >/dev/null

      - name: Deploy to repo branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: repo
          branch: repo
          token: ${{ secrets.GITHUB_TOKEN }}
